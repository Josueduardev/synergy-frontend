<div class="detalle-solicitud__page-container">

  <!-- Logo Section -->
  <div class="detalle-solicitud__logo-section">
    <div class="detalle-solicitud__logo-container">
      <img src="https://jritzygwfhfqrlogqcpy.supabase.co/storage/v1/object/public/logos/EXPRESSPAY.png" alt="ExpressPay"
        class="detalle-solicitud__logo-img" />
    </div>
  </div>


  <!-- Client Info Section -->
  <div class="detalle-solicitud__client-info-section">
    <div class="detalle-solicitud__client-info-container">
      <div class="detalle-solicitud__client-info-flex">
        <div class="detalle-solicitud__client-icon-container">
          <i class="pi pi-building detalle-solicitud__client-icon"></i>
        </div>
        <div class="detalle-solicitud__client-details">
          <p class="detalle-solicitud__client-label">Cliente</p>
          <h1 class="detalle-solicitud__client-name">{{ cliente }}</h1>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="detalle-solicitud__main-content">
    <div class="detalle-solicitud__main-content-container">

      <!-- Financial Details Card -->
      <div class="detalle-solicitud__financial-details-card">
        <div class="detalle-solicitud__card-padding">
          <div class="detalle-solicitud__card-title-container">
            <h3 class="detalle-solicitud__card-title">Detalle de Cesión de Factoraje</h3>
          </div>

          <div class="detalle-solicitud__invoice-details-container">
            <div *ngFor="let detail of invoiceDetails; let last = last"
              [ngClass]="last ? 'detalle-solicitud__invoice-detail-item--last' : 'detalle-solicitud__invoice-detail-item'">
              <span class="detalle-solicitud__detail-concept">{{ detail.concept }}</span>
              <span [ngClass]="last ? 'detalle-solicitud__detail-value--last' : 'detalle-solicitud__detail-value'">{{
                detail.valor }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Add Comment Button -->
      <div *ngIf="validarEstado()" class="detalle-solicitud__add-comment-button-container">
        <button *appHasAction="'Aprobar o denegar'" pButton icon="pi pi-plus" label="Agregar comentario"
          (click)="mostrarModalComentario()" class="detalle-solicitud__add-comment-button">
        </button>
      </div>

      <!-- Action Buttons -->
      <div *ngIf="validarEstado()" class="detalle-solicitud__action-buttons-container">
        <button *appHasAction="'Aprobar o denegar'" pButton label="Aceptar" (click)="confirmarSolicitud('aprobar')"
          class="detalle-solicitud__accept-button">
        </button>
        <button *appHasAction="'Aprobar o denegar'" pButton label="Denegar" (click)="denegarSolicitud('denegar')"
          class="detalle-solicitud__deny-button">
        </button>
      </div>

      <!-- Approver Info -->
      <div *ngIf="validarEstado()" class="detalle-solicitud__approver-info-card">
        <div class="detalle-solicitud__approver-info-container">
          <p class="detalle-solicitud__approver-info-text">
            <span class="detalle-solicitud__approver-info-label">Nombre del Aprobador:</span> {{ aprobador }}
          </p>
          <p class="detalle-solicitud__approver-info-text">
            <span class="detalle-solicitud__approver-info-label">Fecha:</span> {{ fecha }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para ingresar comentario -->
  <p-dialog header="Agregar Comentario" [(visible)]="modalComentarioVisible" [modal]="true" [closable]="true"
    styleClass="detalle-solicitud__comment-dialog">
    <div class="detalle-solicitud__modal-content">
      <textarea [(ngModel)]="comentario" pInputTextarea rows="5" cols="30"
        placeholder="Escribe tu comentario..."></textarea>
    </div>
    <p-footer>
      <button pButton label="Guardar" class="p-button-success" (click)="guardarComentario()"></button>
      <button pButton label="Cancelar" class="p-button-danger" (click)="cancelarComentario()"></button>
    </p-footer>
  </p-dialog>

  <!-- Confirmación de acción (Aceptar o Denegar solicitud) -->
  <p-dialog [header]="accion == 'aprobar' ? 'Aprobación' : 'Denegación' " [(visible)]="modalAccionVisible"
    styleClass="detalle-solicitud__action-dialog">
    <p>¿Está seguro de que desea ejecutar esta acción?</p>
    <p-footer>
      <button pButton [loading]="loading" label="Sí" icon="pi pi-check" class="p-button-success"
        (click)="ejecutarAccion()"></button>
      <button pButton label="No" icon="pi pi-times" class="p-button-danger" (click)="cancelarAccion()"></button>
    </p-footer>
  </p-dialog>

</div>
