<div class="detalle-desembolso__page-container">

  <!-- Logo Section -->
  <div class="detalle-desembolso__logo-section">
    <div class="detalle-desembolso__logo-container">
      <img src="https://jritzygwfhfqrlogqcpy.supabase.co/storage/v1/object/public/logos/EXPRESSPAY.png" alt="ExpressPay"
        class="detalle-desembolso__logo-img" />
    </div>
  </div>

  <!-- Client Info Section -->
  <div class="detalle-desembolso__client-info-section">
    <div class="detalle-desembolso__client-info-container">
      <div class="detalle-desembolso__client-info-flex">
        <div class="detalle-desembolso__client-icon-container">
          <i class="pi pi-building detalle-desembolso__client-icon"></i>
        </div>
        <div class="detalle-desembolso__client-details">
          <p class="detalle-desembolso__client-label">Cliente</p>
          <h1 class="detalle-desembolso__client-name">{{ proveedor }}</h1>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="detalle-desembolso__main-content">
    <div class="detalle-desembolso__header">
      <p class="detalle-desembolso__header-title">Detalle del Desembolso</p>
    </div>

    <!-- Tabla con los detalles -->
    <div class="detalle-desembolso__table">
      <p-table [value]="disbursementDetails" class="p-datatable-striped">
        <!-- Encabezados de la tabla -->
        <ng-template pTemplate="header">
          <tr>
            <th class="detalle-desembolso__table-header">Concepto</th>
            <th class="detalle-desembolso__table-header">Valor</th>
          </tr>
        </ng-template>

        <!-- Cuerpo de la tabla -->
        <ng-template pTemplate="body" let-detail let-last="last">
          <tr [ngClass]="last ? 'detalle-desembolso__table-row--last' : ''">
            <td class="concepto-column detalle-desembolso__table-cell detalle-desembolso__table-cell--concept">{{
              detail.concept }}</td>
            <td class="valor-column detalle-desembolso__table-cell"
              [ngClass]="last ? 'detalle-desembolso__table-cell--value-last' : 'detalle-desembolso__table-cell--value'">
              {{ detail.valor }}</td>
          </tr>
        </ng-template>

        <!-- Mensaje cuando no hay datos -->
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="2" class="text-center detalle-desembolso__empty-message">No hay registros disponibles.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <!-- Fecha de Consulta -->
    <div class="detalle-desembolso__bottom-section">
      <p class="detalle-desembolso__bottom-text">
        <span class="detalle-desembolso__bottom-label">Fecha de Consulta:</span> {{ fecha }}
      </p>
    </div>
  </div>
</div>
